<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign In | The Written Bond</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Libre Baskerville', serif;
      color: #24211f;
      background:
        linear-gradient(rgba(247, 242, 232, 0.92), rgba(247, 242, 232, 0.92)),
        repeating-linear-gradient(
          0deg,
          rgba(70, 60, 50, 0.025) 0px,
          rgba(70, 60, 50, 0.025) 1px,
          transparent 1px,
          transparent 4px
        );
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .welcome {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
      font-family: 'Special Elite', monospace;
      font-size: clamp(28px, 5vw, 48px);
      opacity: 1;
      transition: opacity 0.7s ease;
      z-index: 5;
    }

    .welcome.hide {
      opacity: 0;
      pointer-events: none;
    }

    .signin-card {
      width: 100%;
      max-width: 430px;
      background: rgba(255, 252, 245, 0.88);
      border: 1px solid rgba(45, 40, 35, 0.18);
      padding: 42px 36px;
      opacity: 0;
      transform: translateY(80px);
      transition:
        opacity 0.8s ease,
        transform 0.8s ease;
    }

    .signin-card.show {
      opacity: 1;
      transform: translateY(0);
    }

    .brand {
      font-family: 'Special Elite', monospace;
      font-size: 18px;
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      font-family: 'Special Elite', monospace;
      font-size: 30px;
      font-weight: 400;
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 32px;
      color: #68615b;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #aaa29a;
      background: rgba(255, 255, 255, 0.55);
      font: inherit;
      font-size: 15px;
      margin-bottom: 20px;
      outline: none;
    }

    input:focus {
      border-color: #6f6660;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      background: #252321;
      color: #fffaf1;
      font-family: 'Libre Baskerville', serif;
      font-size: 14px;
      cursor: pointer;
      margin-top: 4px;
    }

    button:hover {
      background: #373330;
    }
.password-toggle {
  width: auto;
  background: transparent;
  color: #6b625c;
  padding: 0;
  margin: -10px 0 20px 0;
  font-size: 12px;
  text-decoration: underline;
  border: none;
}

.password-toggle:hover {
  background: transparent;
  color: #24211f;
}
    .signup {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
    }

    .signup a {
      color: #534a45;
      font-weight: 700;
      text-decoration: none;
    }

    .signup a:hover {
      text-decoration: underline;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 28px;
      font-size: 12px;
      color: #746c66;
      text-decoration: none;
    }

    @media (max-width: 520px) {
      .signin-card {
        padding: 34px 24px;
      }

      h1 {
        font-size: 26px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .welcome {
        display: none;
      }

      .signin-card {
        opacity: 1;
        transform: none;
        transition: none;
      }
    }
  </style>
</head>

<body>

  <div class="welcome" id="welcome">
    Welcome, future bestseller.
  </div>

  <main class="signin-card" id="signinCard">
    <div class="brand">The Written Bond</div>

    <h1 id="formTitle">Sign in</h1>

    <p class="subtitle" id="formSubtitle">
      Welcome back to your author space.
    </p>

    <form id="signinForm">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        autocomplete="current-password"
        required
      >
      <button type="button" id="togglePassword" class="password-toggle">
  Show password
</button>

      <button type="submit" id="submitButton">Sign In</button>
    </form>

    <p class="signup">
  <span id="accountPrompt">New here?</span> <a href="#" id="createAccountLink">Create an account</a>
    </p>

    <a class="back-home" href="index.html">
      ← Back to The Written Bond
    </a>
  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://nyxsibwytoabqiwvgxoxx.supabase.co";
const SUPABASE_KEY = "sb_publishable_AI_R3YGatySsJz0hkeg6MQ_CtqY5CYZ";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
    const welcome = document.getElementById("welcome");
    const signinCard = document.getElementById("signinCard");
    const signinForm = document.getElementById("signinForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const formTitle = document.getElementById("formTitle");
const formSubtitle = document.getElementById("formSubtitle");
const submitButton = document.getElementById("submitButton");
const createAccountLink = document.getElementById("createAccountLink");
    const accountPrompt = document.getElementById("accountPrompt");
    let isCreatingAccount = false;
    togglePassword.addEventListener("click", () => {
  const isHidden = passwordInput.type === "password";

  passwordInput.type = isHidden ? "text" : "password";
  togglePassword.textContent = isHidden ? "Hide password" : "Show password";
});
    createAccountLink.addEventListener("click", (event) => {
  event.preventDefault();

  isCreatingAccount = !isCreatingAccount;

  if (isCreatingAccount) {
    formTitle.textContent = "Create account";
    formSubtitle.textContent = "Your next chapter starts here.";
    submitButton.textContent = "Create Account";
    accountPrompt.textContent = "Already have an account?";
    createAccountLink.textContent = "Sign in";
  } else {
    formTitle.textContent = "Sign in";
    formSubtitle.textContent = "Welcome back to your author space.";
    submitButton.textContent = "Sign In";
    accountPrompt.textContent = "New here?";
    createAccountLink.textContent = "Create an account";
  }
});

    setTimeout(() => {
      welcome.classList.add("hide");

      setTimeout(() => {
        signinCard.classList.add("show");
      }, 500);
    }, 1800);
  signinForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (isCreatingAccount) {
    const { data, error } = await supabaseClient.auth.signUp({
      email: email,
      password: password
    });

    if (error) {
      alert(error.message);
      return;
    }

    alert("Check your email to confirm your account!");
  } else {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      alert(error.message);
      return;
    }

    window.location.href = "index.html";
  }
});
  </script>

</body>
</html>
