<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile | The Written Bond</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
     background:
  url("IMG_2422.jpeg") center center / cover fixed no-repeat,
  #0c0c0d;
      color: #f4f1eb;
      font-family: 'Libre Baskerville', serif;
    }

    header {
      min-height: 76px;
      padding: 18px 6%;
      background: rgba(14, 14, 15, 0.96);
      border-bottom: 1px solid #343438;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .logo {
      font-family: 'Special Elite', monospace;
      font-size: 27px;
      white-space: nowrap;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    nav a {
      color: #e8e4dd;
      text-decoration: none;
      font-size: 13px;
    }

    nav a:hover {
      color: #ffffff;
    }

    .account-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #777279;
      background: #242426;
    }

    .signout-button {
      border: 1px solid #aaa4ac;
      background: transparent;
      color: #f4f1eb;
      padding: 9px 14px;
      border-radius: 3px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
    }

    .profile-page {
      width: min(760px, 94%);
      margin: 38px auto 80px;
    }

    .profile-shell {
      background: rgba(16, 16, 18, 0.9);
      border: 1px solid #353539;
    }

    .profile-background { cursor: pointer;
      width: 100%;
      height: 260px;
      background:
        linear-gradient(rgba(10, 10, 10, 0.2), rgba(10, 10, 10, 0.48)),
        radial-gradient(circle at 30% 35%, #3a3a3c 0%, transparent 30%),
        linear-gradient(135deg, #111113, #29292c 45%, #121214);
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .profile-content {
      padding: 0 32px 34px;
    }

    .profile-picture {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      border: 5px solid #101012;
      background: #29292c;
      object-fit: cover;
      margin-top: -66px;
      position: relative;
      z-index: 2;
    }
    /* PROFILE ACTIVE STORY RING */

.profile-story-ring {
  position: relative;

  width: 132px;
  height: 132px;

  flex: 0 0 132px;

  margin-top: -66px;

  border-radius: 50%;

  z-index: 2;

  isolation: isolate;
}

.profile-story-ring .profile-picture {
  width: 132px;
  height: 132px;

  margin-top: 0;

  box-sizing: border-box;
}

.profile-story-ring.has-active-story {
  cursor: pointer;
}

.profile-story-ring.has-active-story::before {
  content: "";

  position: absolute;

  inset: -9px;

  border-radius: 50%;

  background:
    linear-gradient(
      118deg,
      transparent 0%,
      transparent 26%,
      rgba(255, 255, 255, 0.9) 27%,
      rgba(255, 255, 255, 0.22) 29%,
      transparent 31%,
      transparent 61%,
      rgba(225, 225, 230, 0.7) 62%,
      transparent 65%
    ),
    linear-gradient(
      42deg,
      transparent 0%,
      transparent 45%,
      rgba(255, 255, 255, 0.65) 46%,
      rgba(255, 255, 255, 0.12) 48%,
      transparent 50%
    ),
    linear-gradient(
      145deg,
      #030303 0%,
      #202022 22%,
      #070708 43%,
      #323235 64%,
      #050506 82%,
      #1c1c1f 100%
    );

  box-shadow:
    0 0 0 2px #ffffff,
    0 0 0 3px rgba(0, 0, 0, 0.55);

  z-index: -1;
}
    /* PROFILE STORY VIEWER */

.profile-story-viewer {
  position: fixed;
  inset: 0;

  z-index: 10000;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background: rgba(0, 0, 0, 0.9);
}

.profile-story-viewer[hidden] {
  display: none;
}

.profile-story-frame {
  position: relative;

  width: min(430px, 100%);
  height: min(760px, 92vh);

  overflow: hidden;

  border-radius: 14px;

  background: #111111;

  box-shadow:
    0 20px 60px rgba(0, 0, 0, 0.5);
}

.profile-story-progress {
  position: absolute;

  top: 10px;
  left: 12px;
  right: 12px;

  z-index: 5;

  height: 3px;

  overflow: hidden;

  border-radius: 999px;

  background: rgba(255, 255, 255, 0.3);
}

.profile-story-progress-bar {
  width: 0%;
  height: 100%;

  background: #ffffff;
}

.profile-story-header {
  position: absolute;

  top: 22px;
  left: 14px;
  right: 14px;

  z-index: 5;

  display: flex;
  align-items: center;
  justify-content: space-between;

  color: #ffffff;
}

.profile-story-user {
  display: flex;
  align-items: center;
  gap: 10px;
}

.profile-story-user img {
  width: 38px;
  height: 38px;

  border-radius: 50%;

  object-fit: cover;

  border: 2px solid #ffffff;
}

.profile-story-viewer-name {
  font-size: 14px;
  font-weight: 800;
}

.profile-story-viewer-time {
  margin-top: 2px;

  font-size: 11px;

  opacity: 0.8;
}

.profile-story-close {
  width: 38px;
  height: 38px;

  border: 0;
  border-radius: 50%;

  background: rgba(0, 0, 0, 0.55);
  color: #ffffff;

  font-size: 24px;
  line-height: 1;

  cursor: pointer;
}

.profile-story-viewer-content {
  width: 100%;
  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  background: #111111;
}

.profile-story-viewer-content img,
.profile-story-viewer-content video {
  width: 100%;
  height: 100%;

  display: block;

  object-fit: contain;
}

.profile-story-nav {
  position: absolute;

  top: 50%;

  z-index: 5;

  width: 42px;
  height: 58px;

  transform: translateY(-50%);

  border: 0;
  border-radius: 8px;

  background: rgba(0, 0, 0, 0.32);
  color: #ffffff;

  font-size: 34px;
  line-height: 1;

  cursor: pointer;
}

.profile-story-prev {
  left: 10px;
}

.profile-story-next {
  right: 10px;
}

@media (max-width: 520px) {

  .profile-story-viewer {
    padding: 0;
  }

  .profile-story-frame {
    width: 100%;
    height: 100%;

    border-radius: 0;
  }

}
    /* PROFILE STORY OVERLAYS */

.profile-story-text {
  position: absolute;
  transform: translate(-50%, -50%);
  max-width: 82%;
  padding: 8px 12px;
  font-size: 34px;
  font-weight: 700;
  line-height: 1.15;
  text-align: center;
  white-space: pre-wrap;
  word-break: break-word;
  text-shadow:
    0 2px 4px rgba(0, 0, 0, 0.7);
  color: #ffffff;
  z-index: 3;
}

.profile-story-mention {
  position: absolute;
  transform: translate(-50%, -50%);
  padding: 9px 14px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.92);
  color: #202022;
  font-size: 24px;
  font-weight: 700;
  text-decoration: none;
  z-index: 4;
}

.profile-story-book {
  position: absolute;
  transform: translate(-50%, -50%);
  width: min(340px, 82%);
  padding: 18px;
  border-radius: 14px;
  background:
    linear-gradient(
      145deg,
      rgba(255, 255, 255, 0.97),
      rgba(237, 233, 226, 0.97)
    );
  color: #202022;
  text-align: center;
  box-shadow:
    0 10px 32px rgba(0, 0, 0, 0.38);
  z-index: 4;
}

.profile-story-book-cover {
  display: block;
  width: 150px;
  max-height: 220px;
  margin: 0 auto 16px;
  border-radius: 5px;
  object-fit: cover;
}

.profile-story-book-title {
  font-family:
    "Playfair Display",
    Georgia,
    serif;
  font-size: 26px;
  font-weight: 700;
}

.profile-story-book-author {
  margin-top: 6px;
  font-size: 15px;
  font-weight: 600;
  opacity: 0.75;
}

.profile-story-book-description {
  margin-top: 12px;
  font-size: 14px;
  line-height: 1.4;
}

.profile-story-book-link {
  display: inline-block;
  margin-top: 16px;
  padding: 10px 18px;
  border-radius: 6px;
  background: #202022;
  color: #ffffff;
  font-size: 14px;
  font-weight: 700;
  text-decoration: none;
}


/* PROFILE STORY GRANITE POLL */

.profile-story-poll {
  position: absolute;
  transform: translate(-50%, -50%);
  width: min(340px, 82%);
  padding: 18px;
  border: 1px solid rgba(255, 255, 255, 0.45);
  border-radius: 16px;

  background:
    linear-gradient(
      118deg,
      transparent 0%,
      transparent 27%,
      rgba(255, 255, 255, 0.68) 28%,
      rgba(255, 255, 255, 0.12) 30%,
      transparent 33%,
      transparent 62%,
      rgba(220, 220, 225, 0.5) 63%,
      transparent 66%
    ),
    linear-gradient(
      43deg,
      transparent 0%,
      transparent 43%,
      rgba(255, 255, 255, 0.42) 44%,
      rgba(255, 255, 255, 0.08) 47%,
      transparent 49%
    ),
    linear-gradient(
      145deg,
      rgba(5, 5, 5, 0.92),
      rgba(44, 44, 47, 0.88),
      rgba(8, 8, 9, 0.94)
    );

  backdrop-filter: blur(8px);

  box-shadow:
    0 12px 30px rgba(0, 0, 0, 0.4);

  color: #ffffff;
  text-align: center;
  z-index: 4;
}

.profile-story-poll .story-poll-question {
  margin-bottom: 14px;
  font-size: 24px;
  font-weight: 800;
  line-height: 1.15;
  color: #ffffff;
  text-shadow:
    0 2px 5px rgba(0, 0, 0, 0.5);
}

.profile-story-poll .story-poll-option {
  width: 100%;
  margin-top: 8px;
  padding: 12px 14px;
  border: 1px solid rgba(255, 255, 255, 0.65);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.1);
  color: #ffffff;
  font: inherit;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}

.profile-story-poll .story-poll-option.selected {
  background: rgba(255, 255, 255, 0.28);
  border-color: #ffffff;
}

.profile-story-poll .story-poll-option:disabled {
  cursor: default;
  opacity: 1;
}
.image-viewer[hidden] {
  display: none;
}

.image-viewer {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
  background: rgba(0, 0, 0, 0.92);
}

.image-viewer-image {
  max-width: 90vw;
  max-height: 90vh;
  object-fit: contain;
  border-radius: 6px;
}

.image-viewer-close {
  position: absolute;
  top: 22px;
  right: 28px;
  border: none;
  background: transparent;
  color: #ffffff;

  cursor: pointer;
}

.profile-picture {
  cursor: pointer;
}
    .profile-top {
      display: flex;

    }

}
    .bio {

    }
    .profile-posts-list {
  display: flex;

}

.profile-post-card {

}

.profile-post-header {

saveBookButton.addEventListener("click", async () => {
  const title = bookTitle.value.trim();
  const series = bookSeries.value.trim();
  const genre = bookGenre.value.trim();
  const tropes = bookTropes.value.trim();
  const blurb = bookBlurb.value.trim();
  const link = bookLink.value.trim();
  const coverFile = bookCover.files[0];

  if (!title) {
    alert("Please add a book title.");
    return;
  }

  if (!genre) {
    alert("Please add a genre.");
    return;
  }

  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();

  if (userError || !user) {
    alert("You need to be signed in to post a book.");
    return;
  }

  saveBookButton.disabled = true;
  saveBookButton.textContent = "Posting...";

  let coverUrl = null;
  let coverPath = null;

  try {
    const {
      count: existingBookCount,
      error: countError
    } = await supabaseClient
      .from("books")
      .select("id", {
        count: "exact",
        head: true
      })
      .eq("user_id", user.id);

    if (countError) {
      throw countError;
    }

    const isFirstBook = (existingBookCount ?? 0) === 0;

    if (coverFile) {
      const fileExtension = coverFile.name.split(".").pop();
      const fileName = `${crypto.randomUUID()}.${fileExtension}`;
      coverPath = `${user.id}/${fileName}`;

      const { error: uploadError } = await supabaseClient.storage
        .from("book-covers")
        .upload(coverPath, coverFile);

      if (uploadError) {
        throw uploadError;
      }

      const { data: publicUrlData } = supabaseClient.storage
        .from("book-covers")
        .getPublicUrl(coverPath);

      coverUrl = publicUrlData.publicUrl;
    }

    const {
      data: insertedBook,
      error: insertError
    } = await supabaseClient
      .from("books")
      .insert({
        user_id: user.id,
        title: title,
        series: series || null,
        genre: genre,
        tropes: tropes || null,
        blurb: blurb || null,
        book_link: link || null,
        cover_url: coverUrl,
        cover_path: coverPath
      })
      .select("id, cover_url, cover_path")
      .single();

    if (insertError) {
      if (coverPath) {
        await supabaseClient.storage
          .from("book-covers")
          .remove([coverPath]);
      }

      throw insertError;
    }

    bookTitle.value = "";
    bookSeries.value = "";
    bookGenre.value = "";
    bookTropes.value = "";
    bookBlurb.value = "";
    bookLink.value = "";
    bookCover.value = "";

    bookCoverPreview.innerHTML = `
      <span class="book-cover-icon">＋</span>
      <strong>Add book cover</strong>
      <small>JPG, PNG or WEBP</small>
    `;

    addBookForm.hidden = true;
    addBookButton.hidden = false;

    if (isFirstBook) {
      window.location.href =
        `book.html?id=${encodeURIComponent(insertedBook.id)}&firstBook=1`;
      return;
    }

    await loadBooks(user.id);
    alert("Your book was posted!");

  } catch (error) {
    console.error("Error posting book:", error);
    alert("Something went wrong while posting your book.");

  } finally {
    saveBookButton.disabled = false;
    saveBookButton.textContent = "Post Book";
  }
});

  function formatProfilePostTime(dateString) {
  const postDate = new Date(dateString);
  const now = new Date();

  const secondsAgo =
    Math.floor(
      (now - postDate) / 1000
    );

  if (secondsAgo < 60) {
    return "Just now";
  }

  const minutesAgo =
    Math.floor(secondsAgo / 60);

  if (minutesAgo < 60) {
    return `${minutesAgo}m ago`;
  }

  const hoursAgo =
    Math.floor(minutesAgo / 60);

  if (hoursAgo < 24) {
    return `${hoursAgo}h ago`;
  }

  const daysAgo =
    Math.floor(hoursAgo / 24);

  if (daysAgo === 1) {
    return "Yesterday";
  }

  if (daysAgo < 7) {
    return `${daysAgo}d ago`;
  }

  return postDate.toLocaleDateString(
    "en-US",
    {
      month: "short",
      day: "numeric"
    }
  );
}

  function formatProfileStoryTime(
  dateString
) {

  const storyDate =
    new Date(dateString);

  const now =
    new Date();

  const difference =
    Math.max(
      0,
      now - storyDate
    );

  const minutes =
    Math.floor(
      difference / 60000
    );

  const hours =
    Math.floor(
      difference / 3600000
    );


  if (minutes < 1) {
    return "Just now";
  }

  if (minutes < 60) {
    return `${minutes}m`;
  }

  if (hours < 24) {
    return `${hours}h`;
  }

  return "Yesterday";

}

  await loadProfilePosts(
  profileUserId,
  profile
);
  await loadFollowCounts(profileUserId);
  const isOwnProfile = profileUserId === session.user.id;

editProfileButton.hidden = !isOwnProfile;
followButton.hidden = isOwnProfile;
  if (!isOwnProfile) { 
    followButton.addEventListener("click", async () => {
  if (isOwnProfile) {
    return;
  }

  followButton.disabled = true;

  const isFollowing =
    followButton.dataset.following === "true";

  try {
    if (isFollowing) {
      const { error: unfollowError } =
        await supabaseClient
          .from("follows")
          .delete()
          .eq("follower_id", session.user.id)
          .eq("following_id", profileUserId);

      if (unfollowError) {
        throw unfollowError;
      }

      followButton.textContent = "Follow";
      followButton.dataset.following = "false";

    } else {
      const { error: followError } =
        await supabaseClient
          .from("follows")
          .insert({
            follower_id: session.user.id,
            following_id: profileUserId
          });

      if (followError) {
        throw followError;
      }

      followButton.textContent = "Following";
      followButton.dataset.following = "true";
    }

  } catch (error) {
    await loadFollowCounts(profileUserId);
    console.error("Error changing follow status:", error);
    alert("Something went wrong. Please try again.");

  } finally {
    followButton.disabled = false;
  }
});
  const { data: existingFollow, error: followCheckError } =
    await supabaseClient
      .from("follows")
      .select("follower_id")
      .eq("follower_id", session.user.id)
      .eq("following_id", profileUserId)
      .maybeSingle();

  if (followCheckError) {
    console.error("Error checking follow status:", followCheckError);
  }

  if (existingFollow) {
    followButton.textContent = "Following";
    followButton.dataset.following = "true";
  } else {
    followButton.textContent = "Follow";
    followButton.dataset.following = "false";
  }
}
  displayName.textContent = profile.display_name || "Your Name";
  username.textContent = profile.username
    ? `@${profile.username}`
    : "@username";

  bio.textContent = profile.bio || "";

  if (profile.profile_image_url) {
    profilePicture.src = profile.profile_image_url;
    headerAvatar.src = profile.profile_image_url;
  }

  if (profile.background_image_url) {
    profileBackground.style.backgroundImage =
      `linear-gradient(rgba(10, 10, 10, 0.15), rgba(10, 10, 10, 0.35)), url("${profile.background_image_url}")`;
  }

  const socials = profile.social_links || {};

  setSocialLink("websiteLink", profile.website_url);
  setSocialLink("instagramLink", socials.instagram);
  setSocialLink("tiktokLink", socials.tiktok);
  setSocialLink("goodreadsLink", socials.goodreads);
  setSocialLink("facebookLink", socials.facebook);

  const hasAnySocial =
    profile.website_url ||
    socials.instagram ||
    socials.tiktok ||
    socials.goodreads ||
    socials.facebook;

  if (!hasAnySocial) {
    socialLinks.style.display = "none";
  }
}

signOutButton.addEventListener("click", async () => {
  const { error } = await supabaseClient.auth.signOut();

  if (error) {
    alert(error.message);
    return;
  }

  window.location.href = "index.html";
});

loadProfile();
</script>
