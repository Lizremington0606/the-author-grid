<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile | The Written Bond</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
     background:
  url("IMG_2422.jpeg") center center / cover fixed no-repeat,
  #0c0c0d;
      color: #f4f1eb;
      font-family: 'Libre Baskerville', serif;
    }

    header {
      min-height: 76px;
      padding: 18px 6%;
      background: rgba(14, 14, 15, 0.96);
      border-bottom: 1px solid #343438;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .logo {
      font-family: 'Special Elite', monospace;
      font-size: 27px;
      white-space: nowrap;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    nav a {
      color: #e8e4dd;
      text-decoration: none;
      font-size: 13px;
    }

    nav a:hover {
      color: #ffffff;
    }

    .account-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #777279;
      background: #242426;
    }

    .signout-button {
      border: 1px solid #aaa4ac;
      background: transparent;
      color: #f4f1eb;
      padding: 9px 14px;
      border-radius: 3px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
    }

    .profile-page {
      width: min(760px, 94%);
      margin: 38px auto 80px;
    }

    .profile-shell {
      background: rgba(16, 16, 18, 0.9);
      border: 1px solid #353539;
    }

    .profile-background { cursor: pointer;
      width: 100%;
      height: 260px;
      background:
        linear-gradient(rgba(10, 10, 10, 0.2), rgba(10, 10, 10, 0.48)),
        radial-gradient(circle at 30% 35%, #3a3a3c 0%, transparent 30%),
        linear-gradient(135deg, #111113, #29292c 45%, #121214);
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .profile-content {
      padding: 0 32px 34px;
    }

    .profile-picture {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      border: 5px solid #101012;
      background: #29292c;
      object-fit: cover;
      margin-top: -66px;
      position: relative;
      z-index: 2;
    }
.image-viewer[hidden] {
  display: none;
}

.image-viewer {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
  background: rgba(0, 0, 0, 0.92);
}

.image-viewer-image {
  max-width: 90vw;
  max-height: 90vh;
  object-fit: contain;
  border-radius: 6px;
}

.image-viewer-close {
  position: absolute;
  top: 22px;
  right: 28px;
  border: none;
  background: transparent;
  color: #ffffff;
  font-size: 42px;
  line-height: 1;
  cursor: pointer;
}

.profile-picture {
  cursor: pointer;
}
    .profile-top {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-start;
    }

    .profile-name-area {
      padding-top: 18px;
      min-width: 0;
    }

    .profile-name {
      font-family: 'Special Elite', monospace;
      font-size: 30px;
      font-weight: 400;
      margin-bottom: 4px;
    }

    .username { cursor: pointer;
      color: #aaa5ad;
      font-size: 13px;
    }

    .profile-actions {
      display: flex;
      gap: 10px;
      padding-top: 20px;
    }

    .profile-actions button {
      background: #e3dee5;
      color: #171719;
      border: none;
      padding: 10px 15px;
      border-radius: 3px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
    }

    .profile-actions .secondary {
      background: transparent;
      color: #e3dee5;
      border: 1px solid #77727a;
    }

    .stats {
      display: flex;
      gap: 30px;
      margin: 26px 0 22px;
      flex-wrap: wrap;
    }

    .stat {
      font-size: 13px;
      color: #bcb7bf;
    }

    .stat strong {
      color: #ffffff;
      font-size: 17px;
      margin-right: 5px;
    }
.stat-button {
  border: none;
  background: transparent;
  color: inherit;
  font: inherit;
  padding: 0;
  cursor: pointer;
}

.stat-button:hover {
  opacity: 0.8;
}
    .bio {
      max-width: 620px;
      font-size: 14px;
      line-height: 1.75;
      color: #e0dce2;
      margin-bottom: 18px;
    }

    .social-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      margin-bottom: 28px;
    }

    .social-links a {
      color: #d6d0d8;
      text-decoration: none;
      font-size: 12px;
    }

    .social-links a:hover {
      text-decoration: underline;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid #36363a;
      border-bottom: 1px solid #36363a;
    }

    .tab-button {
      border: none;
      background: transparent;
      color: #97929b;
      padding: 17px 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      border-bottom: 2px solid transparent;
    }

    .tab-button.active {
      color: #ffffff;
      border-bottom-color: #d8d2db;
    }

    .feed {
      padding-top: 26px;
    }
.bookshelf-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 22px;
  padding: 28px 0;
}

.add-book-tile {
  min-height: 230px;
  border: 1px dashed rgba(255, 255, 255, 0.45);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.03);
  color: #f4f1eb;
  font-family: inherit;
  font-size: 15px;
  cursor: pointer;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

    .book-card {
  position: relative;
  min-width: 0;
  cursor: pointer;
}

.book-card-cover {
  width: 100%;
  height: 230px;
  display: block;
  object-fit: cover;
  border-radius: 6px;
}

.book-card-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  padding: 22px;
  background: #ffffff;
  border: 1px solid #d8d8d8;
  color: #171719;
  text-align: center;
}

.book-placeholder-title {
  font-family: 'Special Elite', monospace;
  font-size: 22px;
  line-height: 1.25;
  overflow-wrap: anywhere;
}

.book-card-title {
  margin: 10px 0 3px;
  font-size: 16px;
  color: #f4f1eb;
}

.book-card-series,
.book-card-genre {
  margin: 2px 0;
  font-size: 13px;
  color: #bcbcc1;
}

.book-card-link {
  display: inline-block;
  margin-top: 6px;
  color: #f2eee8;
  font-size: 13px;
}

.add-book-tile:hover {
  background: rgba(255, 255, 255, 0.07);
  border-color: rgba(255, 255, 255, 0.8);
}

.add-book-plus {
  font-size: 34px;
  line-height: 1;
}
    #bookshelfPanel {
  position: relative;
  min-height: 500px;
}

.add-book-modal[hidden] {
  display: none;
}

.add-book-modal {
  position: relative;
  width: 100%;
  box-sizing: border-box;
  z-index: 20;
  background: transparent;
  padding: 28px 0 40px;
}

.add-book-modal-content {
  width: 100%;
  max-width: 620px;
  margin: 0 auto;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.add-book-modal-content h3 {
  margin: 4px 0 20px;
  text-align: center;
  font-family: 'Special Elite', monospace;
  font-size: 25px;
  font-weight: 400;
  color: #f4f1eb;
}

.add-book-modal-content label {
  color: #f4f1eb;
  font-size: 14px;
  margin-top: 5px;
}

.add-book-modal-content input[type="text"],
.add-book-modal-content input[type="url"],
.add-book-modal-content select {
  width: 100%;
  box-sizing: border-box;
  padding: 12px 13px;
  border: 1px solid #55555a;
  border-radius: 5px;
  background: #202023;
  color: #ffffff;
  font-family: inherit;
  font-size: 14px;
}

.add-book-modal-content input::placeholder {
  color: #88888d;
}

.book-cover-input {
  display: none;
}

.book-cover-upload {
  width: 150px;
  height: 210px;
  margin: 4px auto 12px;
  border: 1px dashed #68686d;
  border-radius: 7px;
  background: #202023;
  cursor: pointer;
  overflow: hidden;
}

.book-cover-preview {
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  text-align: center;
  color: #f4f1eb;
}

.book-cover-icon {
  font-size: 34px;
  line-height: 1;
}

.book-cover-preview strong {
  font-size: 14px;
  font-weight: 400;
}

.book-cover-preview small {
  color: #99999e;
  font-size: 11px;
}

.book-cover-preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#saveBookButton {
  margin-top: 14px;
  padding: 12px 18px;
  border: 1px solid #ffffff;
  border-radius: 5px;
  background: #ffffff;
  color: #171719;
  font-family: inherit;
  font-size: 14px;
  cursor: pointer;
}

#saveBookButton:hover {
  background: #e7e7e7;
}

.add-book-close {
  position: absolute;
  top: -4px;
  right: 0;
  border: none;
  background: transparent;
  color: #ffffff;
  font-size: 30px;
  cursor: pointer;
}
    .trope-picker {
  position: relative;
}

.selected-tropes {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 8px;
}

.trope-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 9px;
  border: 1px solid #5f5f64;
  border-radius: 999px;
  background: #202023;
  color: #f4f1eb;
  font-size: 12px;
}

.trope-tag button {
  border: none;
  background: transparent;
  color: #bcbcc1;
  cursor: pointer;
  font-size: 14px;
  padding: 0;
  line-height: 1;
}

.trope-suggestions[hidden] {
  display: none;
}

.trope-suggestions {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  z-index: 30;
  max-height: 190px;
  overflow-y: auto;
  margin-top: 4px;
  border: 1px solid #4f4f54;
  border-radius: 5px;
  background: #202023;
}

.trope-suggestion {
  width: 100%;
  padding: 10px 12px;
  border: none;
  border-bottom: 1px solid #343438;
  background: transparent;
  color: #f4f1eb;
  text-align: left;
  font-family: inherit;
  cursor: pointer;
}

.trope-suggestion:last-child {
  border-bottom: none;
}

.trope-suggestion:hover {
  background: #2b2b2f;
}

.trope-custom-option {
  color: #cfcfd4;
  font-style: italic;
}
    .empty-state {
      text-align: center;
      padding: 62px 24px 72px;
      color: #aaa5ad;
    }

    .empty-state h2 {
      font-family: 'Special Elite', monospace;
      color: #f2eee8;
      font-weight: 400;
      font-size: 23px;
      margin-bottom: 10px;
    }

    .empty-state p {
      font-size: 13px;
      line-height: 1.7;
    }

    @media (max-width: 760px) {
      header {
        padding: 16px 4%;
        flex-wrap: wrap;
      }

      nav {
        order: 3;
        width: 100%;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .profile-page {
        width: 100%;
        margin-top: 0;
      }

      .profile-shell {
        border-left: none;
        border-right: none;
      }

      .profile-background {
        height: 210px;
      }

      .profile-content {
        padding: 0 20px 28px;
      }

      .profile-picture {
        width: 108px;
        height: 108px;
        margin-top: -54px;
      }

      .profile-top {
        display: block;
      }

      .profile-actions {
        padding-top: 16px;
      }

      .stats {
        gap: 18px;
      }
    }

    @media (max-width: 430px) {
      .logo {
        font-size: 21px;
      }

      .account-area {
        gap: 7px;
      }

      .header-avatar {
        width: 34px;
        height: 34px;
      }

      .signout-button {
        padding: 8px 10px;
      }

      .profile-name {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">The Written Bond</div>

  <nav>
    <a href="index.html">Home</a>
    <a href="#">Promote</a>
    <a href="#">Books</a>
    <a href="#">Community</a>
    <a href="#">Resources</a>
  </nav>

  <div class="account-area">
    <img class="header-avatar" id="headerAvatar" src="default-avatar.svg" alt="">
    <button class="signout-button" id="signOutButton">Sign Out</button>
  </div>
</header>

<main class="profile-page">

  <section class="profile-shell">

<div
  class="profile-background"
  id="profileBackground"
  role="button"
  tabindex="0"
  title="Click to view cover image"
></div>

    <div class="profile-content">

<img
  class="profile-picture"
  id="profilePicture"
  src="default-avatar.svg"
  alt="Profile picture"
  role="button"
  tabindex="0"
  title="Click to view profile picture"
>

      <div class="profile-top">

        <div class="profile-name-area">
          <h1 class="profile-name" id="displayName">Your Name</h1>
         <p class="username" id="username" role="button" tabindex="0" title="Click to copy username">@username</p>
        </div>

        <div class="profile-actions">
         <button id="editProfileButton" onclick="window.location.href='profile-setup.html?mode=edit'">Edit Profile</button>
          
        </div>

      </div>

      <div class="stats">
      <button class="stat stat-button" id="followersButton" type="button">
  <strong id="followersCount">0</strong> Followers
</button>
<button class="stat stat-button" id="followingButton" type="button">
  <strong id="followingCount">0</strong> Following
</button>
        <div class="stat"><strong id="likesCount">0</strong> Likes</div>
      </div>

      <p class="bio" id="bio">
        Your bio will appear here.
      </p>

      <div class="social-links" id="socialLinks">
        <a href="#" id="websiteLink">Website</a>
        <a href="#" id="instagramLink">Instagram</a>
        <a href="#" id="tiktokLink">TikTok</a>
        <a href="#" id="goodreadsLink">Goodreads</a>
        <a href="#" id="facebookLink">Facebook</a>
      </div>

      <div class="tabs">
        <button class="tab-button active" data-tab="posts">Posts</button>
        <button class="tab-button" data-tab="bookshelf">Bookshelf</button>
        <button class="tab-button" data-tab="saved">Saved</button>
      </div>

<div class="feed" id="feed">

  <div class="tab-panel" id="postsPanel">
    <div class="empty-state">
      <h2>No posts yet.</h2>
      <p>Your posts will appear here.</p>
    </div>
  </div>

<div class="tab-panel" id="bookshelfPanel" hidden>

  <div class="bookshelf-grid" id="bookshelfGrid">

    <button id="addBookButton" class="add-book-tile" type="button">
      <span class="add-book-plus">+</span>
      <span>Add a Book</span>
    </button>

  </div>

  <div id="addBookForm" class="add-book-modal" hidden>

    <div class="add-book-modal-content">

      <button id="cancelBookButton" class="add-book-close" type="button" aria-label="Close">×</button>

      <h3>Add a Book</h3>

<label class="book-cover-upload" for="bookCover">
  <div class="book-cover-preview" id="bookCoverPreview">
    <span class="book-cover-icon">＋</span>
    <strong>Add book cover</strong>
    <small>JPG, PNG or WEBP</small>
  </div>
</label>

<input
  id="bookCover"
  class="book-cover-input"
  type="file"
  accept="image/png, image/jpeg, image/webp"
>

      <label for="bookTitle">Book title</label>
      <input id="bookTitle" type="text">

      <label for="bookSeries">Series</label>
      <input id="bookSeries" type="text">

      <label for="bookGenre">Genre</label>
     <select id="bookGenre">
  <option value="">Choose a genre</option>

  <option value="Romance">Romance</option>
  <option value="Fantasy">Fantasy</option>
  <option value="Science Fiction">Science Fiction</option>
  <option value="Mystery">Mystery</option>
  <option value="Thriller">Thriller</option>
  <option value="Horror">Horror</option>
  <option value="Historical Fiction">Historical Fiction</option>
  <option value="Contemporary Fiction">Contemporary Fiction</option>
  <option value="Literary Fiction">Literary Fiction</option>
  <option value="Action & Adventure">Action & Adventure</option>
  <option value="Erotica">Erotica</option>

  <option value="Young Adult">Young Adult</option>
  <option value="New Adult">New Adult</option>
  <option value="Middle Grade">Middle Grade</option>
  <option value="Children's">Children's</option>

  <option value="Graphic Novels & Comics">Graphic Novels & Comics</option>
  <option value="Poetry">Poetry</option>

  <option value="Nonfiction">Nonfiction</option>
  <option value="Memoir & Autobiography">Memoir & Autobiography</option>
  <option value="Biography">Biography</option>
  <option value="True Crime">True Crime</option>
  <option value="Self-Help & Personal Development">Self-Help & Personal Development</option>
  <option value="History">History</option>
  <option value="Science & Nature">Science & Nature</option>
  <option value="Business & Finance">Business & Finance</option>
  <option value="Religion & Spirituality">Religion & Spirituality</option>
  <option value="Cookbooks & Food">Cookbooks & Food</option>
  <option value="Travel">Travel</option>
  <option value="Humor">Humor</option>
  <option value="Essays">Essays</option>

  <option value="Other">Other</option>
</select>

<label for="bookTropes">Tropes</label>
<input
  id="bookTropes"
  type="text"
  placeholder="Add your book's tropes"
>
<label for="bookBlurb">Blurb</label>
<textarea
  id="bookBlurb"
  rows="6"
  placeholder="Add your book blurb"
></textarea>
      <label for="bookLink">Book link</label>
      <input id="bookLink" type="url" placeholder="https://">

      <button id="saveBookButton" type="button">Post Book</button>

    </div>

  </div>

</div>
  <div class="tab-panel" id="savedPanel" hidden>
    <div class="empty-state">
      <h2>No saved posts yet.</h2>
      <p>Posts you save will appear here.</p>
    </div>
  </div>

</div>

    </div>

  </section>

</main>
  <div id="profilePictureViewer" class="image-viewer" hidden>
  <button id="closeProfilePictureViewer" class="image-viewer-close" type="button" aria-label="Close profile picture">×</button>

  <img
    id="profilePictureViewerImage"
    class="image-viewer-image"
    src="default-avatar.svg"
    alt="Profile picture enlarged"
  >
</div>
<div id="coverImageViewer" class="image-viewer" hidden>
  <button id="closeCoverImageViewer" class="image-viewer-close" type="button" aria-label="Close cover image">×</button>

  <img
    id="coverImageViewerImage"
    class="image-viewer-image"
    alt="Cover image enlarged"
  >
</div>

<script>
  const SUPABASE_URL = "https://mwwzlbhttgatylmpwzli.supabase.co";
const SUPABASE_KEY = "sb_publishable_UFkxAcITFXu6OtYRTcUKKg_Fw9UcTqR";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const displayName = document.getElementById("displayName");
const username = document.getElementById("username");
const bio = document.getElementById("bio");
const profilePicture = document.getElementById("profilePicture");
  const profilePictureViewer = document.getElementById("profilePictureViewer");
const profilePictureViewerImage = document.getElementById("profilePictureViewerImage");
const closeProfilePictureViewer = document.getElementById("closeProfilePictureViewer");
const headerAvatar = document.getElementById("headerAvatar");
const profileBackground = document.getElementById("profileBackground");
  const coverImageViewer = document.getElementById("coverImageViewer");
const coverImageViewerImage = document.getElementById("coverImageViewerImage");
const closeCoverImageViewer = document.getElementById("closeCoverImageViewer");
const socialLinks = document.getElementById("socialLinks");
const signOutButton = document.getElementById("signOutButton");
  const tabButtons = document.querySelectorAll(".tab-button");
const postsPanel = document.getElementById("postsPanel");
const bookshelfPanel = document.getElementById("bookshelfPanel");
  const bookshelfGrid = document.getElementById("bookshelfGrid");
const savedPanel = document.getElementById("savedPanel");
  const addBookButton = document.getElementById("addBookButton");
const addBookForm = document.getElementById("addBookForm");
const cancelBookButton = document.getElementById("cancelBookButton");
  const saveBookButton = document.getElementById("saveBookButton");
const bookTitle = document.getElementById("bookTitle");
const bookSeries = document.getElementById("bookSeries");
const bookGenre = document.getElementById("bookGenre");
  const bookBlurb = document.getElementById("bookBlurb");
const bookLink = document.getElementById("bookLink");
  const bookCover = document.getElementById("bookCover");
const bookCoverPreview = document.getElementById("bookCoverPreview");
const bookTropes = document.getElementById("bookTropes");
  function switchProfileTab(tabName) {
  tabButtons.forEach((button) => {
    button.classList.toggle("active", button.dataset.tab === tabName);
  });

  postsPanel.hidden = tabName !== "posts";
  bookshelfPanel.hidden = tabName !== "bookshelf";
  savedPanel.hidden = tabName !== "saved";
}

tabButtons.forEach((button) => {
  button.addEventListener("click", () => {
    switchProfileTab(button.dataset.tab);
  });
  });
  addBookButton.addEventListener("click", () => {
  addBookForm.hidden = false;
  addBookButton.hidden = true;
});

cancelBookButton.addEventListener("click", () => {
  addBookForm.hidden = true;
  addBookButton.hidden = false;
});
  bookCover.addEventListener("change", () => {
  const file = bookCover.files[0];

  if (!file) {
    return;
  }

  const previewUrl = URL.createObjectURL(file);

  bookCoverPreview.innerHTML = `
    <img src="${previewUrl}" alt="Book cover preview">
  `;
});
  saveBookButton.addEventListener("click", async () => {
  const title = bookTitle.value.trim();
  const series = bookSeries.value.trim();
  const genre = bookGenre.value.trim();
  const tropes = bookTropes.value.trim();
    const blurb = bookBlurb.value.trim();
  const link = bookLink.value.trim();
  const coverFile = bookCover.files[0];

  if (!title) {
    alert("Please add a book title.");
    return;
  }

  if (!genre) {
    alert("Please add a genre.");
    return;
  }

  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();

  if (userError || !user) {
    alert("You need to be signed in to post a book.");
    return;
  }

  saveBookButton.disabled = true;
  saveBookButton.textContent = "Posting...";

  let coverUrl = null;
  let coverPath = null;

  try {
    if (coverFile) {
      const fileExtension = coverFile.name.split(".").pop();
      const fileName = `${crypto.randomUUID()}.${fileExtension}`;
      coverPath = `${user.id}/${fileName}`;

      const { error: uploadError } = await supabaseClient.storage
        .from("book-covers")
        .upload(coverPath, coverFile);

      if (uploadError) {
        throw uploadError;
      }

      const { data: publicUrlData } = supabaseClient.storage
        .from("book-covers")
        .getPublicUrl(coverPath);

      coverUrl = publicUrlData.publicUrl;
    }

    const { error: insertError } = await supabaseClient
      .from("books")
      .insert({
        user_id: user.id,
        title: title,
        series: series || null,
        genre: genre,
    tropes: tropes || null,
blurb: blurb || null,
book_link: link || null,
cover_url: coverUrl,
cover_path: coverPath
      });

    if (insertError) {
      if (coverPath) {
        await supabaseClient.storage
          .from("book-covers")
          .remove([coverPath]);
      }

      throw insertError;
    }

    bookTitle.value = "";
    bookSeries.value = "";
    bookGenre.value = "";
    bookTropes.value = "";
    bookBlurb.value = "";
    bookLink.value = "";
    bookCover.value = "";

    addBookForm.hidden = true;
    addBookButton.hidden = false;
await loadBooks(user.id);
    alert("Your book was posted!");
  } catch (error) {
    console.error("Error posting book:", error);
    alert("Something went wrong while posting your book.");
  } finally {
    saveBookButton.disabled = false;
    saveBookButton.textContent = "Post Book";
  }
});
async function copyUsername() {
  const usernameText = username.textContent.trim();

  try {
    await navigator.clipboard.writeText(usernameText);

    const originalText = username.textContent;
    username.textContent = "Copied!";

    setTimeout(() => {
      username.textContent = originalText;
    }, 1000);
  } catch (error) {
    alert("Could not copy the username.");
  }
}

username.addEventListener("click", copyUsername);

username.addEventListener("keydown", (event) => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    copyUsername();
  }
});

function setSocialLink(id, url) {
  const link = document.getElementById(id);

  if (url) {
    link.href = url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.style.display = "inline";
  } else {
    link.style.display = "none";
  }
}
async function loadBooks(userId) {
  bookshelfGrid
    .querySelectorAll(".book-card")
    .forEach((card) => card.remove());

  const { data: books, error } = await supabaseClient
    .from("books")
    .select("*")
    .eq("user_id", userId)
    .order("created_at", { ascending: true });

  if (error) {
    console.error("Error loading books:", error);
    return;
  }

  books.forEach((book) => {
    const card = document.createElement("div");
    card.className = "book-card";
    card.addEventListener("click", () => {
  window.location.href = `book.html?id=${encodeURIComponent(book.id)}`;
});
    if (book.cover_url) {
      const cover = document.createElement("img");
      cover.className = "book-card-cover";
      cover.src = book.cover_url;
      cover.alt = `${book.title} book cover`;
      card.appendChild(cover);
  } else {
  const placeholder = document.createElement("div");
  placeholder.className = "book-card-cover book-card-placeholder";

  const placeholderTitle = document.createElement("span");
  placeholderTitle.className = "book-placeholder-title";
  placeholderTitle.textContent = book.title;

  placeholder.appendChild(placeholderTitle);
  card.appendChild(placeholder);
}

    const title = document.createElement("h3");
    title.className = "book-card-title";
    title.textContent = book.title;
    card.appendChild(title);

    if (book.series) {
      const series = document.createElement("p");
      series.className = "book-card-series";
      series.textContent = book.series;
      card.appendChild(series);
    }

    if (book.genre) {
      const genre = document.createElement("p");
      genre.className = "book-card-genre";
      genre.textContent = book.genre;
      card.appendChild(genre);

    }

    bookshelfGrid.insertBefore(card, addBookButton);
  });
}
async function loadProfile() {
  const { data: { session } } = await supabaseClient.auth.getSession();

  if (!session) {
    window.location.href = "signin.html";
    return;
  }

  const { data: profile, error } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", session.user.id)
    .single();

  if (error) {
    if (error.code === "PGRST116") {
      window.location.href = "profile-setup.html";
      return;
    }

    alert(error.message);
    return;
  }
await loadBooks(session.user.id);
  displayName.textContent = profile.display_name || "Your Name";
  username.textContent = profile.username
    ? `@${profile.username}`
    : "@username";

  bio.textContent = profile.bio || "";

  if (profile.profile_image_url) {
    profilePicture.src = profile.profile_image_url;
    headerAvatar.src = profile.profile_image_url;
  }

  if (profile.background_image_url) {
    profileBackground.style.backgroundImage =
      `linear-gradient(rgba(10, 10, 10, 0.15), rgba(10, 10, 10, 0.35)), url("${profile.background_image_url}")`;
  }

  const socials = profile.social_links || {};

  setSocialLink("websiteLink", profile.website_url);
  setSocialLink("instagramLink", socials.instagram);
  setSocialLink("tiktokLink", socials.tiktok);
  setSocialLink("goodreadsLink", socials.goodreads);
  setSocialLink("facebookLink", socials.facebook);

  const hasAnySocial =
    profile.website_url ||
    socials.instagram ||
    socials.tiktok ||
    socials.goodreads ||
    socials.facebook;

  if (!hasAnySocial) {
    socialLinks.style.display = "none";
  }
}
